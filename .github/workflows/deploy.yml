name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
      VITE_CONTACT_PHONE: ${{ secrets.VITE_CONTACT_PHONE }}
      VITE_GOOGLE_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_SCRIPT_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Validate public configuration
        run: |
          node --input-type=module <<'JS'
          const required = ["VITE_CONTACT_EMAIL", "VITE_CONTACT_PHONE", "VITE_GOOGLE_SCRIPT_URL"];
          const missing = required.filter(name => !process.env[name]?.trim());
          if (missing.length) {
            console.error(`Missing repository Actions secrets: ${missing.join(", ")}`);
            process.exit(1);
          }
          JS

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Check code quality
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check translation types
        run: npm run test:types

      - name: Check membership consent and privacy
        run: npm test

      - name: Build for the Pages URL
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
